# SPDX-License-Identifier: MIT
name: Publish to GNOME Extensions

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Submit one tagged release at a time.
concurrency:
  group: publish-gnome-extensions
  queue: max

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Build and submit the tagged release
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    container: docker.io/library/fedora:44
    timeout-minutes: 20
    steps:
      - name: Install GNOME 50 build and test tools
        run: |
          # The build and tests do not need Cisco's optional H.264 codec.
          dnf -y --disablerepo=fedora-cisco-openh264 --setopt=install_weak_deps=False install \
            ca-certificates gettext git gjs glib2 gnome-shell libsoup3 make nodejs python3-pip unzip zip

      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          # Checkout initializes a fresh repository before fetching the tag.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Verify the release tag
        run: node scripts/release-version.js verify-tag "$GITHUB_REF_NAME"

      - name: Check the extension
        run: make check

      - name: Install Shexli
        run: |
          python3 -m venv "$RUNNER_TEMP/shexli"
          "$RUNNER_TEMP/shexli/bin/python" -m pip install -r requirements-lint.txt

      - name: Build and analyze the installable ZIP
        id: build
        run: |
          make lint PYTHON="$RUNNER_TEMP/shexli/bin/python"
          uuid=$(node -p "require('./metadata.json').uuid")
          archive="dist/$uuid.shell-extension.zip"
          unzip -tq "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Save the installable ZIP
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
          overwrite: true # Allow rerunning the same workflow after a failed submission.

      - name: Submit to GNOME Extensions for review
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
          EXTENSION_ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          if [[ -z "$EGO_USERNAME" || -z "$EGO_PASSWORD" ]]; then
            echo '::error::Set the EGO_USERNAME and EGO_PASSWORD Actions secrets to submit a version.'
            exit 1
          fi

          # Pass the password through stdin and remove it from the uploader's environment.
          printf '%s\n' "$EGO_PASSWORD" | env -u EGO_PASSWORD \
            gnome-extensions upload --accept-tos --user "$EGO_USERNAME" --password-file=- "$EXTENSION_ARCHIVE"
          echo 'Submitted to GNOME Extensions for review.' >> "$GITHUB_STEP_SUMMARY"
